# @dshp/file-change-viewer bundle patch: file change viewer for DeepSeek Harness.
# Host half: settings 命名空间 + 三条 /ext 路由（state / config / locate）；另按设置里的
#   `patchTool` 开关（测试版，默认关）动态注册 / 反注册 patch 工具。详见 src/host/index.ts 头注释。
# Client half: 三处注册——
#   ① 设置节 settings.section「File Change View」：展示方式（两张带真实样张的单选卡）+ 上下文行数
#      + 默认展开 + patch 工具开关；
#   ② 接管 tool.call.toolview 的 edit / write / str_replace_editor / patch 卡片；
#   ③ 会话页头 conversation.session.header.utilities：两个只作用于当前会话的快捷开关
#      （一键展开 / 收起本会话的全部文件改动、切换差异视图），内存态、不写 settings.yaml。

- insert:
    - id: dshp-file-change-viewer
      name: '@dshp/file-change-viewer'
