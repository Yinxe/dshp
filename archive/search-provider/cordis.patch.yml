# @dshp/search-provider bundle patch: pluggable AI search providers for DeepSeek Harness.
# Host half: registers search providers (tavily first) to ctx.web + /ext/dshp-search-provider/* routes.
# Client half: Settings page section (provider switch / key / behavior / usage / connectivity test).
#
# 选中提供方仍需在 profile 的 cordis.patch.yml 里显式声明（多提供方并存时的唯一选型入口）：
#   - id: web
#     config:
#       searchProvider: tavily

- insert:
    - id: dshp-search-provider
      name: '@dshp/search-provider'
