# ============================================================================
# CICD：门禁 + 打包 + 发布
#
# 触发与行为（**只有 main 与 v* tag 能产出发布物**）：
#   推送 main                     → 门禁 → 打包 → 重建 latest（正式渠道，
#                                    Latest 徽标置顶，资产名 -latest.tgz）
#   推送 v* tag                   → 门禁 → 打包 → 版本 Release（静态存档，
#                                    --generate-notes，资产名 -<tag>.tgz）
#   推送其他分支 / PR             → 仅门禁（check，token 只读，不打包、不发布）
#   手动触发（workflow_dispatch） → 只在 main（或 v* tag）上产出发布物：
#                                    suffix=latest 同 main；自定义后缀按 rolling 勾选
#                                    决定预发布（随滚动）或静态正式版；在别的分支上
#                                    触发只跑门禁并打一条 notice
#
# 为什么分支持下发版被拿掉：任何分支推送都发一次「分支同名预发布」会让 Release 列表被
# 一次性分支刷屏，并且立刻撞上下面那条「除 latest 外最多 1 个滚动项」的数量约束（CI 直接
# 报错终止）。分支上的构建产物没有意义——要给人试就用 main 的 latest，或手动触发指定后缀。
#
# 滚动约定：
#   滚动集合 = 除 latest 外的所有预发布 + notes 首行带 <!-- rolling: true --> 标记的
#   release，数量最多 1 个——超限立即报错终止（创建前与 main 重建前各校验一次）。
#   停止跟随 = 取消 Pre-release 勾选或删除标记行。
#   v* 版本 Release 是静态存档：永不滚动、永不持有 Latest 徽标。
#
# 包命名：dshp-<插件名>-<后缀>.tgz；后缀 = latest | tag 名 | 手动输入的后缀
# ============================================================================

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      suffix:
        description: '包名后缀（如 latest 或 v0.1.5-rc.1）；latest 且构建自 main 时滚动更新 latest，其他后缀创建同名 tag 与 Release'
        required: false
        default: 'latest'
      rolling:
        description: '配合自定义后缀：勾选=预发布并随 main 滚动（默认）；不勾=静态正式版，不随构建变化'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      suffix: ${{ steps.meta.outputs.suffix }}
      pack: ${{ steps.meta.outputs.pack }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # 后缀来源：tag 推送 = tag 名；手动触发 = 输入（默认 latest）；main 推送 = latest。
      # 打包范围：**只有 v* tag / main 推送 / main（或 v* tag）上的手动触发**——
      # 其他分支推送与 PR 一律 pack=false，只跑门禁，不产出发布物。
      - name: Determine package suffix
        id: meta
        env:
          INPUT_SUFFIX: ${{ inputs.suffix }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            suffix="$GITHUB_REF_NAME"
          else
            suffix="${INPUT_SUFFIX:-latest}"
          fi
          if [[ ! "$suffix" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ || "$suffix" == *..* ]]; then
            echo "::error::suffix 仅允许字母数字与 . _ -（不得以 . - 开头或含 ..，需可作为 git tag），实际收到：$suffix"
            exit 1
          fi

          # 唯一的发布判据就是这个 pack：publish 作业整体挂在它上面（`if: pack == 'true'`），
          # 所以想加/减发布通道只需要动这一处，不要在别处重复判断 ref。
          pack=false
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" == "refs/heads/main" || "$GITHUB_REF" == refs/tags/v* ]]; then
              pack=true
            else
              echo "::notice::手动触发在 $GITHUB_REF 上不产出发布物（发布只来自 main 与 v* tag），本次仅跑门禁"
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == "refs/heads/main" ]]; then
              pack=true
            fi
          fi
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "pack=$pack" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

      - name: Pack maintained plugins
        if: steps.meta.outputs.pack == 'true'
        env:
          SUFFIX: ${{ steps.meta.outputs.suffix }}
        run: |
          mkdir -p dist
          # 只打包 plugins/ 下的维护中插件；archive/ 是冻结存档，不参与发布
          for dir in plugins/*/; do
            pkg_name=$(node -p "require('./${dir}package.json').name")
            pkg_ver=$(node -p "require('./${dir}package.json').version")
            short=${pkg_name##*/}
            (cd "$dir" && pnpm pack --pack-destination ../../dist)
            mv "dist/dshp-$short-$pkg_ver.tgz" "dist/dshp-$short-$SUFFIX.tgz"
          done
          ls -lh dist

      - uses: actions/upload-artifact@v4
        if: steps.meta.outputs.pack == 'true'
        with:
          name: dshp-plugins-${{ steps.meta.outputs.suffix }}
          path: dist/*.tgz
          if-no-files-found: error

  # 发布。注意：checkout 必须在 download-artifact 之前——checkout 默认 clean: true
  # 会执行 git clean -ffdx，放在后面会把先下载的 dist/ 清空
  publish:
    needs: check
    if: needs.check.outputs.pack == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: dshp-plugins-${{ needs.check.outputs.suffix }}
          path: dist

      # ── 路径 A：v* tag → 版本 Release（静态存档）─────────────────────────────
      - name: Release (versioned tag)
        if: github.ref_type == 'tag'
        run: |
          # tag 可能由 web 端发布 release 时先行创建，此时追加资产；否则新建并生成 notes
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tgz --generate-notes
          fi
          # 新建正式版默认抢走 Latest 徽标；滚动渠道 latest 才是置顶入口，让位并归还
          gh release edit "$GITHUB_REF_NAME" --latest=false
          gh release edit latest --latest || true

      # ── 路径 B：手动触发的自定义后缀 → 同名 tag + Release ────────────────────
      # 分支推送不再走这里（非 main 的推送 pack=false，publish 作业整体不跑）。
      - name: Release (manual suffix)
        if: github.event_name == 'workflow_dispatch' && inputs.suffix != 'latest'
        env:
          SUFFIX: ${{ needs.check.outputs.suffix }}
          ROLLING: ${{ inputs.rolling }}
        run: |
          # 数量校验：除 latest 与本次的 $SUFFIX 外，不允许已存在其他滚动预发布
          mapfile -t other_pre < <(gh release list --json tagName,isPrerelease --limit 100 \
            --jq '.[] | select(.isPrerelease and .tagName != "latest") | .tagName' \
            | grep -Fvx -- "$SUFFIX" || true)
          if [ "${#other_pre[@]}" -ge 1 ]; then
            echo "::error::除 latest 外已存在滚动预发布 ${other_pre[*]}，同时最多允许 1 个（本次 $SUFFIX 除外）；请先取消多余的 Pre-release 勾选或删除后重试"
            exit 1
          fi

          # 发布形态：手动触发由 rolling 勾选决定（勾 = 预发布并随 main 滚动）
          pre="$ROLLING"
          header="手动触发的测试构建（${GITHUB_SHA::7}）。同名 tag 为 workflow 自动创建。"

          # 覆盖护栏：版本号形态（v+数字）的正式 release 拒绝覆盖；其余整体重建
          if gh release view "$SUFFIX" >/dev/null 2>&1; then
            if [ "$(gh release view "$SUFFIX" --json isPrerelease -q .isPrerelease)" != "true" ] && [[ "$SUFFIX" =~ ^v[0-9] ]]; then
              echo "::error::已存在同名正式版本 release，拒绝覆盖（suffix=$SUFFIX）"
              exit 1
            fi
            gh release delete "$SUFFIX" --yes --cleanup-tag
          fi

          NOTES_HEADER="$header" \
          NOTES_HINT="正式发版前请先删除：\`gh release delete $SUFFIX --cleanup-tag --yes\`" \
            node scripts/gen-release-notes.cjs
          create_args=(dist/*.tgz --target "$GITHUB_SHA" --title "$SUFFIX" --notes-file notes.md)
          if [ "$pre" = "true" ]; then create_args+=(--prerelease); fi
          gh release create "$SUFFIX" "${create_args[@]}"
          if [ "$pre" != "true" ]; then
            # 静态正式版不抢 Latest 徽标（latest 才是置顶渠道）
            gh release edit "$SUFFIX" --latest=false
          fi

      # ── 路径 C：main / 手动 latest → 滚动刷新 ────────────────────────────────
      # 滚动集合 = 除 latest 外的所有预发布 + notes 首行带 <!-- rolling: true --> 标记的
      # release，最多 1 个（超限立即报错终止）；latest 最后重建并授予 Latest 徽标置顶
      - name: Refresh rolling releases
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.suffix == 'latest')
        env:
          CUR_SUFFIX: ${{ needs.check.outputs.suffix }} # dist 内包的当前后缀（本路径恒为 latest）
        run: |
          mapfile -t rolling < <(gh release list --json tagName,isPrerelease --limit 100 \
            --jq '.[] | select(.tagName != "latest") | [.tagName, .isPrerelease] | @tsv' \
            | while IFS=$'\t' read -r t pre; do
                marked=$(gh release view "$t" --json body -q '.body | contains("<!-- rolling: true -->")')
                if [ "$pre" = "true" ] || [ "$marked" = "true" ]; then
                  printf '%s|%s|%s\n' "$t" "$pre" "$marked"
                fi
              done)

          # 数量校验：最多 1 个；超限立即报错终止，不动任何现有 Release
          if [ "${#rolling[@]}" -gt 1 ]; then
            names=""
            for r in "${rolling[@]}"; do names="$names ${r%%|*}"; done
            echo "::error::除 latest 外检测到 ${#rolling[@]} 个滚动 release（$names ）；同时最多允许 1 个，请取消多余项的 Pre-release 勾选、删除标记行或删除 Release 后重试"
            exit 1
          fi

          # 1) 先重建滚动项：dist 内是 latest 命名的包，滚到其他 tag 需改名副本上传
          for r in "${rolling[@]}"; do
            IFS='|' read -r tag pre marked <<< "$r"
            if [ -z "$tag" ]; then continue; fi
            echo "重建滚动 release: $tag (pre=$pre)"
            rm -rf dist-roll && mkdir dist-roll
            for f in dist/*.tgz; do
              base=$(basename "$f")
              cp "$f" "dist-roll/${base%-$CUR_SUFFIX.tgz}-$tag.tgz"
            done
            gh release delete "$tag" --yes --cleanup-tag || true
            SUFFIX="$tag" \
            DIST_DIR=dist-roll \
            NOTES_HEADER="滚动构建自 main 分支（${GITHUB_SHA::7}），每次推送自动整体替换。" \
            NOTES_ROLLING="$marked" \
              node scripts/gen-release-notes.cjs
            create_args=(dist-roll/*.tgz --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md)
            if [ "$pre" = "true" ]; then create_args+=(--prerelease); fi
            gh release create "$tag" "${create_args[@]}"
          done
          rm -rf dist-roll

          # 2) 最后重建 latest 并授予 Latest 徽标（创建时间最新 + 显式指定 → 列表置顶）
          gh release delete latest --yes --cleanup-tag || true
          NOTES_HEADER="滚动构建自 main 分支（${GITHUB_SHA::7}），每次推送自动整体替换。" \
            node scripts/gen-release-notes.cjs
          gh release create latest dist/*.tgz \
            --target "$GITHUB_SHA" \
            --title "latest (main@${GITHUB_SHA::7})" \
            --notes-file notes.md
          gh release edit latest --latest || true
